[project]
name = "dtc-delhi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gtfs-realtime-bindings>=3.0.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "windows-curses>=2.4.2 ; sys_platform == 'win32'",
]

[project.scripts]
dtc-delhi = "dtc_delhi:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
